# wf-server ACL rules. One entry per line; '#' starts a comment.
#
#   blacklist <ip-or-cidr>
#   whitelist <ip-or-cidr>
#
# IPv4 and IPv6 supported; bare IPs are treated as /32 (v4) or /128 (v6).
# Semantics: blacklist wins (deny even if also whitelisted); if the
# whitelist is non-empty, IPs not in it are denied.
#
# The file is re-read when its mtime changes. A broken file keeps the
# previous rules in effect.

# Examples:
# blacklist 203.0.113.0/24
# blacklist 2001:db8:dead::/48
# whitelist 192.168.0.0/16
