# wf-server configuration (flat "key = value"; '#' starts a comment)

# Listen port
port = 8080

# Directory whose files are served
root = ./files

# Maximum bytes returned in a single response (Range requests are truncated
# to this cap). Default: 8 MiB.
cap_bytes = 8388608

# Non-Range requests for files larger than this get 413.
# Default: equal to cap_bytes (omit to use that).
# size_threshold_bytes = 8388608

# Per-IP bandwidth limit in bytes/sec. 0 or omitted disables limiting.
rate_bytes_per_sec = 10485760

# Max seconds a rate-limited request may be delayed before 429. Default 30.
max_wait_sec = 30

# Which X-Forwarded-For entry (counted from the right) is the real client.
# Default 1 = rightmost (the one appended by the nearest trusted proxy).
trust_hops = 1

# ACL rules file. Empty/omitted disables ACL.
acl_file = config/acl.conf

# How often (seconds) the ACL file's mtime is polled for hot reload.
acl_poll_interval_sec = 5

# Workflow server max_connections. Tune together with cap_bytes:
# peak memory is roughly max_connections * cap_bytes.
max_connections = 2000
